[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "vault-hsm-signer"
version = "0.1.0"
description = "Software-defined payment Hardware Security Module (HSM) simulator for card issuing and acquiring"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "Apache-2.0" }
authors = [
    { name = "aipd506" }
]
keywords = ["hsm", "iso9564", "pinblock", "emv", "arqc", "luhn", "cvv", "pvv", "banking", "payments", "pos"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Financial and Insurance Industry",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security :: Cryptography",
    "Topic :: Office/Business :: Financial :: Point-Of-Sale",
]
dependencies = []

[project.scripts]
bankhsm = "vault_hsm_signer.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["vault_hsm_signer*"]
